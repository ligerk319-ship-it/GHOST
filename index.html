<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GHOST</title>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;margin:0;padding:20px}
.card{background:#111;border:1px solid #222;border-radius:20px;padding:20px;max-width:400px;margin:20px auto}
input,select{width:90%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #333;background:#000;color:#fff}
button{background:#7CFF6B;color:#000;padding:12px 20px;border:none;border-radius:25px;font-weight:bold;width:90%;margin-top:10px}
.hidden{display:none}
.green{color:#7CFF6B}
.profile{border:1px solid #222;border-radius:15px;padding:15px;margin:10px}
</style>
</head>
<body>

<div id="welcome">
<h1 class="green">WELCOME TO<br>GHOST</h1>
<div style="font-size:80px">👦👻</div>
<div class="card">
<button onclick="show('signup')">Create New Account</button>
<button onclick="show('login')" style="background:#fff">Login</button>
</div>
</div>

<div id="signup" class="hidden">
<h2 class="green">Create Account</h2>
<div class="card">
<input id="fn" placeholder="First name">
<input id="ln" placeholder="Last name">
<input id="phone" placeholder="Phone number OR Email">
<input id="pass" type="password" placeholder="Password">
<input id="dob" type="date">
<select id="gender"><option>Male</option><option>Female</option><option>Custom</option></select>
<button onclick="sendCode()">Sign Up</button>
<p onclick="show('login')" class="green">Already have account? Login</p>
</div>
</div>

<div id="code" class="hidden">
<h2 class="green">Enter Code</h2>
<div class="card">
<p>We sent code to <span id="to"></span></p>
<input id="codeInput" placeholder="Enter 6-digit code (use 123456)">
<button onclick="verify()">Verify</button>
</div>
</div>

<div id="profileSetup" class="hidden">
<h2 class="green">Setup Profile</h2>
<div class="card">
<input type="file" id="pic" accept="image/*">
<input id="bio" placeholder="Add Bio">
<button onclick="show('discover')">Add Friends / Continue</button>
</div>
</div>

<div id="login" class="hidden">
<h2 class="green">Login</h2>
<div class="card">
<input id="loginPhone" placeholder="Phone number OR Email">
<input id="loginPass" type="password" placeholder="Password">
<button onclick="doLogin()">Login</button>
<p onclick="show('signup')" class="green">Create new account</p>
</div>
</div>

<div id="discover" class="hidden">
<h2 class="green">Discover People</h2>
<div class="card profile">
<h3>Mia, 24</h3>
<p>Love music ❤️</p>
<button>❤️ Like</button> <button>👻 Ghost</button>
</div>
<div class="card profile">
<h3>Leo, 26</h3>
<p>Gym & Travel</p>
<button>❤️ Like</button> <button>👻 Ghost</button>
</div>
<button onclick="show('welcome')">Logout</button>
</div>

<script>
function show(id){
document.querySelectorAll('body > div').forEach(d=>d.classList.add('hidden'));
document.getElementById(id).classList.remove('hidden');
}
function sendCode(){
if(!fn.value||!ln.value||!phone.value||!pass.value){alert('Fill all fields');return}
localStorage.setItem('user',JSON.stringify({phone:phone.value,pass:pass.value}));
document.getElementById('to').innerText=phone.value;
show('code');
}
function verify(){
if(codeInput.value=='123456'){show('profileSetup');}else{alert('Wrong code. Use 123456 for test');}
}
function doLogin(){
let u=JSON.parse(localStorage.getItem('user')||'{}');
if(loginPhone.value==u.phone && loginPass.value==u.pass){show('discover');}
else{alert('No account found. Please create account first!');show('signup');}
}
</script>
</body>
</html>
