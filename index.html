<!DOCTYPE html><html><head><title>GHOST</title><meta name="viewport" content="width=device-width"><style>body{background:#000;color:#0f0;font-family:monospace;padding:20px}h1{text-align:center;font-size:40px}#box{border:2px solid #0f0;padding:20px;border-radius:15px}input{width:70%;padding:12px;background:#111;color:#0f0;border:1px solid #0f0}button{padding:12px;background:#0f0;color:#000;font-weight:bold;border:none}#chat{margin-top:20px}.msg{background:#111;padding:10px;margin:5px 0;border-left:3px solid #0f0}</style></head><body><h1>👻 GHOST</h1><p style="text-align:center">Invisible. Fast. Unstoppable.</p><div id="box"><input id="m" placeholder="Type invisible message..."><button onclick="send()">SEND</button><div id="chat"></div></div><script>function send(){let i=document.getElementById('m');let c=document.getElementById('chat');if(i.value){let d=document.createElement('div');d.className='msg';d.innerText='👻 '+i.value; c.prepend(d);i.value=''}} </script></body></html>
